<!DOCTYPE html>
<html>
<head>
    <title>OCR Document Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; }
        input[type="file"] { padding: 8px; }
        button { padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OCR Document Processing</h1>
        <form action="/perform_ocr" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="document">Upload Document (Image/PDF):</label>
                <input type="file" id="document" name="document" accept=".jpg,.jpeg,.png,.pdf" required>
            </div>
            <button type="submit">Process Document</button>
        </form>
        
        {% if result %}
        <div class="result">
            <h3>OCR Results:</h3>
            <pre>{{ result }}</pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
